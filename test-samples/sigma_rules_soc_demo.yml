---
title: Pass-the-Hash Detection via NTLM Logon
id: 10000000-0000-4000-8000-000000000011
status: experimental
description: Detects NTLM logons using the hash instead of the password, characteristic of pass-the-hash attacks
author: SOC Demo - Detection Engineering
date: 2025/03/20
tags:
    - attack.lateral_movement
    - attack.t1550.002
logsource:
    category: authentication
    product: windows
    service: security
detection:
    selection:
        EventID: 4624
        LogonType: '3'
        WorkstationName: '-'
    condition: selection
falsepositives:
    - Legacy protocol authentication flows
level: high

---
title: RDP Brute Force - Multiple Failed Logins
id: 10000000-0000-4000-8000-000000000012
status: stable
description: Detects a high volume of failed RDP authentication attempts within a short window
author: SOC Demo - Detection Engineering
date: 2025/01/30
tags:
    - attack.credential_access
    - attack.t1110.003
    - attack.initial_access
logsource:
    category: authentication
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        LogonType: '10'
    timeframe: 5m
    condition: selection | count() by SourceIp > 15
falsepositives:
    - Misconfigured clients retrying
level: high

---
title: Credential Stuffing via User Agent Anomaly
id: 10000000-0000-4000-8000-000000000013
status: experimental
description: Detects automated login attempts with unusual user agents against web portals
author: SOC Demo - Detection Engineering
date: 2025/05/01
tags:
    - attack.credential_access
    - attack.t1110.004
logsource:
    category: web_application
    product: generic
detection:
    selection:
        cs-uri-stem|contains: '/login'
        cs(User-Agent)|contains:
            - 'curl/'
            - 'python-requests'
            - 'Go-http-client'
    condition: selection
falsepositives:
    - API automation and legitimate tools
level: medium

---
title: Shadow Copy Deletion - Potential Ransomware
id: 10000000-0000-4000-8000-000000000014
status: stable
description: Detects vssadmin or wmic shadow copy deletion, a standard ransomware pre-encryption step
author: SOC Demo - Detection Engineering
date: 2025/02/22
tags:
    - attack.impact
    - attack.t1490
    - attack.defense_evasion
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\vssadmin.exe'
            - '\wmic.exe'
        CommandLine|contains:
            - 'delete shadows'
            - 'shadowcopy delete'
            - 'shadowstorage delete'
    condition: selection
level: critical

---
title: Mass File Encryption - Ransomware Extension
id: 10000000-0000-4000-8000-000000000015
status: stable
description: Detects large volumes of file rename operations typical of mass ransomware encryption
author: SOC Demo - Detection Engineering
date: 2025/02/22
tags:
    - attack.impact
    - attack.t1486
logsource:
    category: file_event
    product: windows
detection:
    selection:
        EventType: Rename
        TargetFilename|endswith:
            - '.crypt'
            - '.locked'
            - '.encrypted'
            - '.8bfa0'
    timeframe: 10m
    condition: selection | count() by User > 100
falsepositives:
    - Backup software mass operations
level: critical

---
title: Data Exfiltration via Cloud Storage Upload
id: 10000000-0000-4000-8000-000000000016
status: experimental
description: Detects large outbound uploads to cloud storage services not typically used by the organization
author: SOC Demo - Detection Engineering
date: 2025/04/05
tags:
    - attack.exfiltration
    - attack.t1567.002
    - attack.collection
    - attack.t1074
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName|endswith:
            - '.mega.nz'
            - '.transfer.sh'
            - '.mediafire.com'
            - '.sendspace.com'
    condition: selection
falsepositives:
    - Personal use of cloud storage
level: high

---
title: Data Staging to Temp Directory
id: 10000000-0000-4000-8000-000000000017
status: experimental
description: Detects large file copies into temporary directories prior to exfiltration
author: SOC Demo - Detection Engineering
date: 2025/04/08
tags:
    - attack.collection
    - attack.t1074.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Operation: Write
        TargetFilename|startswith: 'C:\Users\*\AppData\Local\Temp\'
        Size|gte: 52428800
    condition: selection
falsepositives:
    - Installers unpacking content
level: medium

---
title: C2 Beacon - Suspicious DNS Query Pattern
id: 10000000-0000-4000-8000-000000000018
status: experimental
description: Detects high-frequency DNS queries to the same domain, a pattern consistent with C2 beaconing
author: SOC Demo - Detection Engineering
date: 2025/05/10
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryType: A
    timeframe: 1m
    condition: selection | count() by QueryName > 60
level: medium

---
title: Disabling Security Tools (Tamper Event)
id: 10000000-0000-4000-8000-000000000019
status: experimental
description: Detects attempts to stop or disable EDR and monitoring services
author: SOC Demo - Detection Engineering
date: 2025/06/01
tags:
    - attack.defense_evasion
    - attack.t1562.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\sc.exe'
            - '\net.exe'
        CommandLine|contains:
            - 'stop'
            - 'config'
        CommandLine|contains:
            - 'WinDefend'
            - 'Sense'
            - 'sysmon'
            - 'CrowdStrike'
    condition: selection
falsepositives:
    - Legitimate troubleshooting by IT
level: high