# ============================================================
# Purple Team Mapper — Jeu de règles SOC de démonstration
# Fichier Sigma multi-documents (chaque règle séparée par ---)
# Scénario: SOC d'entreprise avec couverture partielle
#   (Initial Access fort, exfil/impact faible)
# ============================================================

title: Suspicious Attachment Executed from Phishing Email
id: 10000000-0000-4000-8000-000000000001
status: stable
description: Detects child processes spawned by Office applications (WINWORD, EXCEL, OUTLOOK) that are typical of macro-based phishing initial access
author: SOC Demo - Detection Engineering
date: 2025/02/10
tags:
    - attack.initial_access
    - attack.t1566.001
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith:
            - '\WINWORD.EXE'
            - '\EXCEL.EXE'
            - '\OUTLOOK.EXE'
            - '\POWERPNT.EXE'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
    condition: selection
falsepositives:
    - Legitimate document automation macros
level: high

---
title: Malicious Link Clicked in Email (URL Shortener / Unknown TLD)
id: 10000000-0000-4000-8000-000000000002
status: experimental
description: Detects navigation or download from phishing links with suspicious TLDs, a common initial access vector
author: SOC Demo - Detection Engineering
date: 2025/02/12
tags:
    - attack.initial_access
    - attack.t1566.002
logsource:
    category: proxy
    product: windows
    service: edge
detection:
    selection:
        RequestUrl|contains:
            - '.top'
            - '.xyz'
            - '.click'
            - 'bit.ly/'
            - 'tinyurl.com/'
            - 'shorturl.at/'
    condition: selection
falsepositives:
    - User-driven marketing campaigns
level: medium

---
title: PowerShell Encoded Command Execution
id: 10000000-0000-4000-8000-000000000003
status: stable
description: Detects PowerShell execution with encoded commands, often used to obfuscate malicious scripts after initial access
author: SOC Demo - Detection Engineering
date: 2025/01/15
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - '-EncodedCommand'
            - '-enc '
            - '-ec '
    condition: selection
falsepositives:
    - Legitimate administrative scripts
level: high

---
title: HTML Application (.hta) Execution from Suspicious Path
id: 10000000-0000-4000-8000-000000000004
status: stable
description: Detects mshta.exe launched with an external .hta payload, a bypass technique used by droppers
author: SOC Demo - Detection Engineering
date: 2025/03/01
tags:
    - attack.defense_evasion
    - attack.t1218.005
    - attack.execution
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\mshta.exe'
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - '\\'
            - '.hta'
    filter:
        CommandLine|contains: 'about:blank'
    condition: selection and not filter
falsepositives:
    - Rare legitimate web-enabled HTA views
level: high

---
title: Mimikatz LSASS Memory Dump Attempt
id: 10000000-0000-4000-8000-000000000005
status: stable
description: Detects credential dumping attempts against LSASS via Mimikatz or similar tooling
author: SOC Demo - Detection Engineering
date: 2025/01/20
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_sig:
        Image|endswith:
            - '\mimikatz.exe'
            - '\mimikatz64.exe'
        CommandLine|contains: 'sekurlsa::logonpasswords'
    selection_handle:
        FileAccess|contains: 'Process_Access'
        GrantAccess|contains: '0x1010'
        TargetImage|endswith: '\lsass.exe'
    condition: selection_sig or selection_handle
falsepositives:
    - Legitimate credential tools used by IT on special cases
level: critical

---
title: NTDS.dit Access from Non-Domain-Controller Host
id: 10000000-0000-4000-8000-000000000006
status: experimental
description: Detects copy or shadow-copy access to NTDS.dit, indicative of Active Directory database exfiltration
author: SOC Demo - Detection Engineering
date: 2025/03/15
tags:
    - attack.credential_access
    - attack.t1003.003
logsource:
    category: file_access
    product: windows
detection:
    selection:
        TargetFilename|endswith: '\ntds.dit'
        SourceImage|startswith: 'C:\Windows\System32\'
    filter_dc:
        Image|endswith: '\ntdsutil.exe'
    condition: selection and not filter_dc
falsepositives:
    - Legitimate backup jobs
level: high

---
title: Suspicious Scheduled Task Creating Persistence
id: 10000000-0000-4000-8000-000000000007
status: stable
description: Detects scheduled task creation pointing to unusual locations, a common persistence mechanism
author: SOC Demo - Detection Engineering
date: 2025/02/05
tags:
    - attack.persistence
    - attack.t1053.005
    - attack.privilege_escalation
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains:
            - '/create'
            - '-create'
        CommandLine|contains:
            - '\AppData\'
            - '\Temp\'
            - 'C:\Users\Public'
    condition: selection
falsepositives:
    - Legitimate automation deployments
level: high

---
title: Registry Run Key Persistence Modification
id: 10000000-0000-4000-8000-000000000008
status: stable
description: Detects additions or modifications to registry Run keys, a classic persistence technique
author: SOC Demo - Detection Engineering
date: 2025/01/25
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|contains:
            - 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run'
            - 'HKLM\Software\Microsoft\Windows\CurrentVersion\Run'
    condition: selection
falsepositives:
    - Legitimate software auto-start entries
level: medium

---
title: WMI Event Subscription Persistence
id: 10000000-0000-4000-8000-000000000009
status: experimental
description: Detects creation of WMI event subscriptions, a stealthy persistence and execution mechanism
author: SOC Demo - Detection Engineering
date: 2025/04/10
tags:
    - attack.persistence
    - attack.t1546.003
    - attack.execution
logsource:
    category: wmi_event
    product: windows
detection:
    selection:
        Operation: CreateInstance
        ObjectClass:
            - __EventFilter
            - __EventConsumer
    condition: selection
falsepositives:
    - Legitimate enterprise management (SCCM, monitoring)
level: medium

---
title: PsExec Lateral Movement
id: 10000000-0000-4000-8000-000000000010
status: stable
description: Detects PsExec/SMB lateral movement with ADMIN$ share access
author: SOC Demo - Detection Engineering
date: 2025/02/18
tags:
    - attack.lateral_movement
    - attack.t1021.002
