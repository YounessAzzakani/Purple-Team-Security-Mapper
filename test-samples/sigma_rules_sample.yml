title: Detect PowerShell Encoded Command Execution
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: stable
description: Detects execution of PowerShell with encoded command parameter, often used to obfuscate malicious scripts
author: Purple Team Mapper - Test
date: 2024/01/15
modified: 2024/06/01
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - '-EncodedCommand'
            - '-enc '
            - '-ec '
    condition: selection
fields:
    - CommandLine
    - ParentImage
falsepositives:
    - Legitimate administrative scripts
level: high
---
title: Mimikatz LSASS Memory Dump Detection
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: stable
description: Detects Mimikatz-like credential dumping from LSASS memory using common patterns
author: Purple Team Mapper - Test
date: 2024/02/10
tags:
    - attack.credential_access
    - attack.t1003.001
    - attack.t1003
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            - '0x1010'
            - '0x1410'
            - '0x147a'
            - '0x1f1fff'
    condition: selection
falsepositives:
    - Security software
    - Antivirus scanners
level: critical
---
title: Suspicious Scheduled Task Creation
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: stable
description: Detects suspicious scheduled task creation used for persistence
author: Purple Team Mapper - Test
date: 2024/03/05
tags:
    - attack.persistence
    - attack.t1053.005
    - attack.privilege_escalation
    - attack.t1053
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4698
        TaskContent|contains:
            - 'powershell'
            - 'cmd.exe'
            - 'wscript'
            - 'cscript'
            - 'regsvr32'
    condition: selection
falsepositives:
    - Legitimate software installation
    - Administrative tasks
level: high
---
title: Network Connection to Suspicious Domain (Phishing C2)
id: d4e5f6a7-b8c9-0123-defa-234567890123
status: experimental
description: Detects outbound DNS/HTTP connections to freshly registered or suspicious domains indicative of phishing or C2
author: Purple Team Mapper - Test
date: 2024/04/01
tags:
    - attack.command_and_control
    - attack.t1071.001
    - attack.t1071
    - attack.initial_access
    - attack.t1566
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName|endswith:
            - '.xyz'
            - '.top'
            - '.click'
            - '.gq'
            - '.tk'
    filter_legit:
        QueryName|contains:
            - 'microsoft.com'
            - 'google.com'
            - 'windows.com'
    condition: selection and not filter_legit
falsepositives:
    - Legitimate sites on new TLDs
level: medium
---
title: Ransomware File Extension Change (Mass Encryption)
id: e5f6a7b8-c9d0-1234-efab-345678901234
status: stable
description: Detects mass file rename/modification consistent with ransomware encryption behavior
author: Purple Team Mapper - Test
date: 2024/05/20
tags:
    - attack.impact
    - attack.t1486
    - attack.t1490
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith:
            - '.locked'
            - '.encrypted'
            - '.crypted'
            - '.crypt'
            - '.enc'
    condition: selection | count() > 20
falsepositives:
    - Backup software
level: critical
---
title: Shadow Copy Deletion (Anti-Forensics)
id: f6a7b8c9-d0e1-2345-fabc-456789012345
status: stable
description: Detects deletion of VSS shadow copies - common ransomware step to prevent recovery
author: Purple Team Mapper - Test
date: 2024/06/10
tags:
    - attack.defense_evasion
    - attack.impact
    - attack.t1490
    - attack.t1070
logsource:
    category: process_creation
    product: windows
detection:
    selection_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains: 'delete shadows'
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains:
            - 'shadowcopy delete'
            - 'shadowcopy where'
    selection_powershell:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: 'Win32_ShadowCopy'
    condition: 1 of selection_*
falsepositives:
    - Legitimate backup cleanup scripts
level: critical
---
title: Pass-the-Hash / Lateral Movement via PsExec
id: a7b8c9d0-e1f2-3456-abcd-567890123456
status: stable
description: Detects lateral movement using PsExec or similar tools with stolen NTLM hashes
author: Purple Team Mapper - Test
date: 2024/07/15
tags:
    - attack.lateral_movement
    - attack.t1021.002
    - attack.t1550.002
    - attack.credential_access
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4624
        LogonType: 3
        AuthenticationPackageName: 'NTLM'
        WorkstationName|contains: 'PSEXEC'
    condition: selection
falsepositives:
    - Legitimate administrative PsExec usage
level: high
---
title: Suspicious Registry Run Key Persistence
id: b8c9d0e1-f2a3-4567-bcde-678901234567
status: stable
description: Detects malware persistence via Windows registry Run keys
author: Purple Team Mapper - Test
date: 2024/08/01
tags:
    - attack.persistence
    - attack.t1547.001
    - attack.t1547
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce'
        Details|contains:
            - 'powershell'
            - 'cmd.exe'
            - 'wscript'
            - 'mshta'
            - 'regsvr32'
    condition: selection
falsepositives:
    - Software installers
level: medium
---
title: Data Exfiltration via Cloud Storage Upload
id: c9d0e1f2-a3b4-5678-cdef-789012345678
status: experimental
description: Detects large file uploads to cloud storage services that could indicate data exfiltration
author: Purple Team Mapper - Test
date: 2024/09/01
tags:
    - attack.exfiltration
    - attack.t1567.002
    - attack.t1567
    - attack.collection
    - attack.t1074
logsource:
    category: proxy
    product: windows
detection:
    selection:
        cs-method: 'PUT'
        cs-host|contains:
            - 'dropbox.com'
            - 'mega.nz'
            - 'anonfiles.com'
            - 'transfer.sh'
            - 'wetransfer.com'
        cs-bytes|gt: 10000000
    condition: selection
falsepositives:
    - Legitimate cloud backups
    - Authorized file sharing
level: high
---
title: Brute Force Attack Detection on RDP
id: d0e1f2a3-b4c5-6789-defa-890123456789
status: stable
description: Detects brute force attempts against RDP (multiple failed login attempts)
author: Purple Team Mapper - Test
date: 2024/10/01
tags:
    - attack.credential_access
    - attack.t1110.003
    - attack.t1110
    - attack.initial_access
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        LogonType: 10
    condition: selection | count(SubjectUserName) by IpAddress > 10
falsepositives:
    - Misconfigurations
level: high
